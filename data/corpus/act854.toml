# Document card: facts about Act-854.pdf that the parser cannot guess, read off the PDF by hand.
# Every "line" value is copied exactly from data/work/act854.lines.txt (written by the extract step).
# The file name (act854) is the document id and the chunk id prefix: act854:s23:1.

title        = "Cyber Security Act 2024 (Act 854)"
short_name   = "ACT854"                  # filter value used by the planner and in citations
version_date = 2024-06-26                # "Date of publication in the Gazette", PDF page 2
pdf          = "../raw/Act-854.pdf"      # relative to this file
extraction   = "plain"                   # pypdf's default mode reads this PDF cleanly
page_offset  = 0                         # printed page number = PDF page number

# Running header on the first line of every page ({page} = the printed page number).
headers = ["Cyber Security {page}", "Laws of Malaysia{page} Act 854"]
footers = []

# Table of contents: the "Arrangement of Sections", PDF pages 3-6. The outline is generated from it.
toc_starts_after = "ARRANGEMENT OF SECTIONS"
toc_ends_before  = "Schedule"

# Body: the enacting formula marks where the operative law starts (Part I, section 1);
# the Schedule on page 50 is where it ends.
body_starts_after = "ENACTED by the Parliament of Malaysia as follows:"
body_ends_before  = "Schedule"

unit        = "Section"                  # chunk ids use "s": act854:s23:1
definitions = ["4"]                      # s4 Interpretation: one chunk per defined term

# Blocks that are not numbered sections, each kept as one chunk (first and last line included).
[long_title]                             # page 7, above the enacting formula
heading    = "Long title"
first_line = "An Act to enhance the national cyber security by providing for"
last_line  = "providers through licensing, and to provide for related matters."

[schedule]                               # page 50; the printer's text after item 11 is left out
heading    = "National critical information infrastructure sector"
first_line = "Schedule"
last_line  = "11. Science, technology and innovation"
